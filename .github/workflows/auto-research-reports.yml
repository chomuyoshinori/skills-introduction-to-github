name: Auto Research Reports

# 毎日、リサーチ・分析チームを自動起動して reports/ にレポートを生成・コミットする。
# ⚠️ 重要な前提:
#  1) スケジュール(cron)は GitHub の仕様上「デフォルトブランチ(main)にこのファイルがある時のみ」発火します。
#     → 自動化を有効にするには、このワークフローを main にマージしてください。
#  2) リポジトリの Settings → Secrets and variables → Actions に `ANTHROPIC_API_KEY` を登録してください。
#  3) サブエージェント多数 + Web検索のため、1回の実行で相応の API 利用料が発生します
#     (レッドチームは品質重視で opus を使用。コストを抑えたい場合は
#      .claude/agents/red-team-critic.md の model を sonnet に変更してください)。
#  4) cron は UTC 表記です(JST = UTC+9)。
#  5) 東証の大引けは 15:30 JST(2024年11月以降)。日本株レポートは終値確定後の 16:00 JST に実行します。

on:
  schedule:
    - cron: '0 7 * * 1-5'    # 平日 07:00 UTC = 16:00 JST(大引け15:30の終値確定後)→ 日本株
    - cron: '0 22 * * 1-5'   # 平日 22:00 UTC = 翌朝07:00 JST(米国市場引け後。JSTでは火〜土曜の朝)→ 米国株
    - cron: '0 23 * * *'     # 毎日 23:00 UTC = 翌朝08:00 JST(24時間市場)→ 暗号資産
    - cron: '0 0 * * 6'      # 毎週土曜 00:00 UTC = 09:00 JST → 振り返り(学習ループ)
    - cron: '0 1 1 * *'      # 毎月1日 01:00 UTC = 10:00 JST → ポートフォリオリスク定量点検
  workflow_dispatch:          # 手動実行(テスト用)。下のドロップダウンで対象を選ぶ。
    inputs:
      report:
        description: 'どのレポートを実行するか'
        required: true
        default: jp
        type: choice
        options: [jp, us, crypto, retro, risk]

# 連続する cron(22:00 の米国株と 23:00 の暗号資産など)が重なって
# 同時にコミット・プッシュして衝突しないよう、直列実行にする。
concurrency:
  group: auto-research-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write        # reports/ をコミット・プッシュするため
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Select report command
        id: sel
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * 1-5")  echo "cmd=/daily-report"  >> "$GITHUB_OUTPUT" ;;
            "0 22 * * 1-5") echo "cmd=/us-report"     >> "$GITHUB_OUTPUT" ;;
            "0 23 * * *")   echo "cmd=/crypto-report" >> "$GITHUB_OUTPUT" ;;
            "0 0 * * 6")    echo "cmd=/retrospective" >> "$GITHUB_OUTPUT" ;;
            "0 1 1 * *")    echo "cmd=/portfolio-risk" >> "$GITHUB_OUTPUT" ;;
            *)  # 手動実行(workflow_dispatch)
              case "${{ github.event.inputs.report }}" in
                us)     echo "cmd=/us-report"     >> "$GITHUB_OUTPUT" ;;
                crypto) echo "cmd=/crypto-report" >> "$GITHUB_OUTPUT" ;;
                retro)  echo "cmd=/retrospective" >> "$GITHUB_OUTPUT" ;;
                risk)   echo "cmd=/portfolio-risk" >> "$GITHUB_OUTPUT" ;;
                *)      echo "cmd=/daily-report"  >> "$GITHUB_OUTPUT" ;;
              esac ;;
          esac

      # --allowedTools に列挙したツールのみ自動許可される(それ以外は拒否)。
      # Bash はエージェントの用途(python3 での検算・日付確認)に限定する。
      - name: Run research team (headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "${{ steps.sel.outputs.cmd }}" \
            --allowedTools "Task,WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python3:*),Bash(date:*),Bash(mkdir:*)" \
            --max-turns 150

      # 実行が途中で打ち切られても、生成済みのレポートは回収してコミットする。
      - name: Commit & push report
        if: always()
        run: |
          git config user.name  "research-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ theses/ DECISION_LOG*.md LESSONS.md
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "auto: ${{ steps.sel.outputs.cmd }} $(date -u +%Y-%m-%d)"
          # 実行中に他のコミットが入っていても失敗しないよう、リベースしてからプッシュ(最大3回)
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗 (${i}回目)。5秒後に再試行します。"
            sleep 5
          done
          echo "::error::プッシュに3回失敗しました"
          exit 1
